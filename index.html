<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>شبیه‌ساز دی‌جی موبایل</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 8px;
        }

        header h1 {
            font-size: 1.2rem;
            color: #66fcf1;
            letter-spacing: 1px;
        }

        /* بخش افکت نوری و استیج */
        .stage {
            width: 100%;
            max-width: 480px;
            height: 70px;
            background: #1f2833;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 12px;
            border: 2px solid #45a29e;
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.2);
            transition: background 0.05s ease, box-shadow 0.05s ease;
        }

        .lights-bar {
            display: flex;
            gap: 8px;
            z-index: 2;
        }

        .light-bulb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #333;
            box-shadow: 0 0 2px #000;
            transition: background 0.05s, transform 0.05s, box-shadow 0.05s;
        }

        .status-text {
            font-size: 0.75rem;
            margin-top: 6px;
            color: #fff;
            font-weight: bold;
            z-index: 2;
        }

        /* ساختار دک‌ها */
        .decks-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 480px;
        }

        .deck {
            background: #151a21;
            border: 1px solid #303c4c;
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        .deck-a { border-left: 4px solid #ff0055; }
        .deck-b { border-left: 4px solid #00d2ff; }

        .deck-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .deck-title {
            font-weight: bold;
            font-size: 0.9rem;
        }
        .deck-a .deck-title { color: #ff0055; }
        .deck-b .deck-title { color: #00d2ff; }

        .file-label {
            background: #202b38;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            border: 1px solid #45a29e;
            color: #66fcf1;
        }

        input[type="file"] {
            display: none;
        }

        .track-name {
            font-size: 0.75rem;
            color: #8892b0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: right;
        }

        /* کنترل‌ها */
        .controls-row {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            color: #fff;
            background: #2a3644;
            transition: 0.1s transform, 0.1s background;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-play { background: #00875a; }
        .btn-play.active { background: #00b875; box-shadow: 0 0 10px #00b875; }
        .btn-pause { background: #de350b; }
        .btn-stop { background: #42526e; }

        .fader-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .fader-label {
            font-size: 0.7rem;
            display: flex;
            justify-content: space-between;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #66fcf1;
            height: 6px;
            background: #2a3644;
            border-radius: 4px;
            outline: none;
        }

        /* پنل وسط و کراس‌فیدر */
        .master-panel {
            background: #11161d;
            border: 1px solid #45a29e;
            border-radius: 14px;
            padding: 14px;
            width: 100%;
            max-width: 480px;
            margin-top: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        }

        .crossfader-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }

        .crossfader-labels {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .crossfader-labels span:first-child { color: #ff0055; }
        .crossfader-labels span:last-child { color: #00d2ff; }

        .crossfader-slider {
            width: 100%;
            height: 12px;
            accent-color: #66fcf1;
        }
    </style>
</head>
<body>

    <header>
        <h1>DJ MIXER & LIGHTS</h1>
    </header>

    <!-- استیج افکت نوری -->
    <div class="stage" id="stage">
        <div class="lights-bar">
            <div class="light-bulb" id="bulb-0"></div>
            <div class="light-bulb" id="bulb-1"></div>
            <div class="light-bulb" id="bulb-2"></div>
            <div class="light-bulb" id="bulb-3"></div>
            <div class="light-bulb" id="bulb-4"></div>
        </div>
        <div class="status-text" id="statusText">آماده برای میکس</div>
    </div>

    <!-- بدنه دک‌ها -->
    <div class="decks-container">
        
        <!-- دک A -->
        <div class="deck deck-a">
            <div class="deck-header">
                <span class="deck-title">DECK A</span>
                <label class="file-label">
                    انتخاب آهنگ
                    <input type="file" id="fileA" accept="audio/*">
                </label>
            </div>
            <div class="track-name" id="nameA">فایلی انتخاب نشده</div>
            
            <div class="controls-row">
                <button class="btn btn-play" id="playA">پخش ▶</button>
                <button class="btn btn-pause" id="pauseA">توقف ❚❚</button>
                <button class="btn btn-stop" id="stopA">ریست ◼</button>
            </div>

            <div class="fader-group">
                <div class="fader-label">
                    <span>ولوم دک A</span>
                    <span id="volAVal">100%</span>
                </div>
                <input type="range" id="volA" min="0" max="1" step="0.01" value="1">
            </div>
        </div>

        <!-- دک B -->
        <div class="deck deck-b">
            <div class="deck-header">
                <span class="deck-title">DECK B</span>
                <label class="file-label">
                    انتخاب آهنگ
                    <input type="file" id="fileB" accept="audio/*">
                </label>
            </div>
            <div class="track-name" id="nameB">فایلی انتخاب نشده</div>
            
            <div class="controls-row">
                <button class="btn btn-play" id="playB">پخش ▶</button>
                <button class="btn btn-pause" id="pauseB">توقف ❚❚</button>
                <button class="btn btn-stop" id="stopB">ریست ◼</button>
            </div>

            <div class="fader-group">
                <div class="fader-label">
                    <span>ولوم دک B</span>
                    <span id="volBVal">100%</span>
                </div>
                <input type="range" id="volB" min="0" max="1" step="0.01" value="1">
            </div>
        </div>

    </div>

    <!-- پنل کراس‌فیدر -->
    <div class="master-panel">
        <div class="crossfader-container">
            <div class="crossfader-labels">
                <span>DECK A</span>
                <span>کراس‌فیدر (ترکیب)</span>
                <span>DECK B</span>
            </div>
            <input type="range" class="crossfader-slider" id="crossfader" min="0" max="1" step="0.01" value="0.5">
        </div>
    </div>

    <script>
        // ساخت AudioContext برای مدیریت صدا و استخراج فرکانس
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        // کلاس مدیریت هر دک
        class Deck {
            constructor(id) {
                this.id = id;
                this.audio = new Audio();
                this.audio.crossOrigin = "anonymous";
                this.source = null;
                this.gainNode = null;
                this.crossGainNode = null;
                this.analyser = null;
                this.volume = 1;
                this.isLoaded = false;
            }

            initAudioGraph() {
                if (!audioCtx) {
                    audioCtx = new AudioContext();
                }
                if (!this.source) {
                    this.source = audioCtx.createMediaElementSource(this.audio);
                    this.gainNode = audioCtx.createGain();
                    this.crossGainNode = audioCtx.createGain();
                    this.analyser = audioCtx.createAnalyser();
                    this.analyser.fftSize = 64;

                    // زنجیره اتصال صوتی: Source -> Gain -> CrossGain -> Analyser -> Output
                    this.source.connect(this.gainNode);
                    this.gainNode.connect(this.crossGainNode);
                    this.crossGainNode.connect(this.analyser);
                    this.analyser.connect(audioCtx.destination);
                }
            }

            loadTrack(file) {
                if (file) {
                    this.audio.src = URL.createObjectURL(file);
                    this.audio.load();
                    this.isLoaded = true;
                }
            }

            play() {
                if (!this.isLoaded) return;
                this.initAudioGraph();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                this.audio.play();
            }

            pause() {
                this.audio.pause();
            }

            stop() {
                this.audio.pause();
                this.audio.currentTime = 0;
            }

            setVolume(val) {
                this.volume = val;
                if (this.gainNode) {
                    this.gainNode.gain.value = val;
                }
            }

            setCrossfadeGain(val) {
                if (this.crossGainNode) {
                    this.crossGainNode.gain.value = val;
                }
            }

            getVolumeLevel() {
                if (!this.analyser || this.audio.paused) return 0;
                const dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                this.analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                }
                return sum / dataArray.length; // میانگین انرژی صدا بین 0 تا 255
            }
        }

        const deckA = new Deck('A');
        const deckB = new Deck('B');

        // اتصال رویدادهای Deck A
        document.getElementById('fileA').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                deckA.loadTrack(file);
                document.getElementById('nameA').textContent = file.name;
            }
        });
        document.getElementById('playA').addEventListener('click', () => deckA.play());
        document.getElementById('pauseA').addEventListener('click', () => deckA.pause());
        document.getElementById('stopA').addEventListener('click', () => deckA.stop());
        document.getElementById('volA').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            deckA.setVolume(val);
            document.getElementById('volAVal').textContent = Math.round(val * 100) + '%';
        });

        // اتصال رویدادهای Deck B
        document.getElementById('fileB').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                deckB.loadTrack(file);
                document.getElementById('nameB').textContent = file.name;
            }
        });
        document.getElementById('playB').addEventListener('click', () => deckB.play());
        document.getElementById('pauseB').addEventListener('click', () => deckB.pause());
        document.getElementById('stopB').addEventListener('click', () => deckB.stop());
        document.getElementById('volB').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            deckB.setVolume(val);
            document.getElementById('volBVal').textContent = Math.round(val * 100) + '%';
        });

        // مدیریت کراس‌فیدر (Crossfader)
        const crossfader = document.getElementById('crossfader');
        function updateCrossfader() {
            const val = parseFloat(crossfader.value); // بین 0 تا 1
            // فرمول Equal Power یا خطی ساده:
            const gainA = Math.cos(val * 0.5 * Math.PI);
            const gainB = Math.cos((1.0 - val) * 0.5 * Math.PI);

            deckA.setCrossfadeGain(gainA);
            deckB.setCrossfadeGain(gainB);
        }
        crossfader.addEventListener('input', updateCrossfader);

        // حلقه رندر افکت نوری هماهنگ با بیت و انرژی صدا
        const stage = document.getElementById('stage');
        const bulbs = [
            document.getElementById('bulb-0'),
            document.getElementById('bulb-1'),
            document.getElementById('bulb-2'),
            document.getElementById('bulb-3'),
            document.getElementById('bulb-4')
        ];
        const statusText = document.getElementById('statusText');

        const colors = ['#ff0055', '#ff9900', '#66fcf1', '#00d2ff', '#b537f2'];

        function renderLights() {
            requestAnimationFrame(renderLights);

            const levelA = deckA.getVolumeLevel();
            const levelB = deckB.getVolumeLevel();
            const totalLevel = Math.max(levelA, levelB);

            if (totalLevel > 5) {
                // افکت نوری پس‌زمینه استیج بر اساس بیت
                const brightness = Math.min(1, totalLevel / 120);
                const bgIntensity = Math.floor(brightness * 80);
                stage.style.backgroundColor = `rgb(${bgIntensity}, ${Math.floor(bgIntensity * 0.5)}, ${Math.floor(bgIntensity * 0.8)})`;
                stage.style.boxShadow = `0 0 ${20 * brightness}px rgba(102, 252, 241, ${brightness * 0.8})`;

                // روشن کردن چراغ‌ها به تناسب حجم صدا
                const activeBulbs = Math.ceil((totalLevel / 140) * bulbs.length);
                bulbs.forEach((bulb, idx) => {
                    if (idx < activeBulbs) {
                        const col = colors[idx % colors.length];
                        bulb.style.backgroundColor = col;
                        bulb.style.boxShadow = `0 0 12px ${col}`;
                        bulb.style.transform = 'scale(1.25)';
                    } else {
                        bulb.style.backgroundColor = '#333';
                        bulb.style.boxShadow = 'none';
                        bulb.style.transform = 'scale(1)';
                    }
                });

                statusText.textContent = "ON AIR • در حال پخش";
                statusText.style.color = "#66fcf1";
            } else {
                // حالت خاموش یا بدون صدا
                stage.style.backgroundColor = '#1f2833';
                stage.style.boxShadow = 'none';
                bulbs.forEach(bulb => {
                    bulb.style.backgroundColor = '#333';
                    bulb.style.boxShadow = 'none';
                    bulb.style.transform = 'scale(1)';
                });
                statusText.textContent = "آماده برای میکس";
                statusText.style.color = "#8892b0";
            }
        }

        renderLights();
    </script>
</body>
</html>
