<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دی‌جی حرفه‌ای</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Tahoma,Arial,sans-serif;background:#0a0a12;color:#e2e8f0;padding:16px;line-height:1.6;overflow-x:hidden;transition:background .5s}.container{max-width:500px;margin:0 auto;text-align:center}h1{color:#f59e0b;margin-bottom:20px}.deck{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:20px 0}.deck-side{background:#1e293b;border-radius:20px;padding:15px;box-shadow:0 8px 25px rgba(0,0,0,.4)}.turntable{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#334155,#0f172a);margin:15px auto;position:relative;display:flex;align-items:center;justify-content:center}.vinyl{width:90px;height:90px;border-radius:50%;background:repeating-radial-gradient(circle,#111,#222 2px);border:2px solid #444}.spinning{animation:spin 2s linear infinite}@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}.btn{background:#f59e0b;color:#111827;border:none;border-radius:12px;padding:10px 20px;font-size:.9rem;font-weight:700;cursor:pointer;margin:5px}.btn:active{transform:scale(.95)}.slider{width:100%;margin:8px 0}.crossfader{width:100%;margin:20px 0}.beat-dots{display:flex;gap:5px;justify-content:center;margin:10px 0}.dot{width:8px;height:8px;border-radius:50%;background:#334155;transition:all .1s}.dot.on{background:#f59e0b;transform:scale(1.5)}canvas{width:100%;height:200px;border-radius:12px;background:transparent}.status{font-size:.8rem;color:#94a3b8;margin-top:10px}</style></head><body><div class="container"><h1>🎧 دی‌جی حرفه‌ای</h1><div class="deck"><div class="deck-side"><h3>کانال A</h3><div class="turntable"><div class="vinyl" id="vinylA"></div></div><button class="btn" onclick="toggleA()" id="btnA">▶️ پخش A</button><input type="range" class="slider" id="volA" min="0" max="1" step="0.01" value="0.8"><div class="beat-dots" id="dotsA"></div></div><div class="deck-side"><h3>کانال B</h3><div class="turntable"><div class="vinyl" id="vinylB"></div></div><button class="btn" onclick="toggleB()" id="btnB">▶️ پخش B</button><input type="range" class="slider" id="volB" min="0" max="1" step="0.01" value="0.8"><div class="beat-dots" id="dotsB"></div></div></div><div class="crossfader"><label>کراس‌فیدر</label><input type="range" class="slider" id="crossfade" min="0" max="1" step="0.01" value="0.5"></div><canvas id="visualizer"></canvas><div class="beat-dots" id="masterDots"></div><button class="btn" onclick="document.getElementById('fileA').click()">🎵 آهنگ A</button><button class="btn" onclick="document.getElementById('fileB').click()">🎵 آهنگ B</button><input type="file" id="fileA" accept="audio/*" style="display:none"><input type="file" id="fileB" accept="audio/*" style="display:none"><div class="status" id="status">آهنگ انتخاب کنید و پخش را بزنید</div></div><script>
let audioA=null,audioB=null,ctxA=null,ctxB=null,gainA=null,gainB=null;
let isPlayingA=false,isPlayingB=false;

// نقطه‌های نمایش ضرب
for(let i=0;i<6;i++){
  document.getElementById('dotsA').innerHTML+='<div class="dot" id="da'+i+'"></div>';
  document.getElementById('dotsB').innerHTML+='<div class="dot" id="db'+i+'"></div>';
  document.getElementById('masterDots').innerHTML+='<div class="dot" id="dm'+i+'"></div>';
}

// الماس‌های بصری
let diamonds=[];
for(let i=0;i<20;i++){
  diamonds.push({x:Math.random()*400,y:Math.random()*200,r:Math.random()*3+1,vx:Math.random()*0.5,vy:Math.random()*0.5,rot:Math.random()*Math.PI,alpha:Math.random()*0.5+0.2});
}

document.getElementById('fileA').addEventListener('change',e=>{
  if(e.target.files[0]){
    audioA=new Audio(URL.createObjectURL(e.target.files[0]));
    audioA.loop=true;
    setupAudio('A',audioA);
    document.getElementById('status').textContent='کانال A آماده';
  }
});

document.getElementById('fileB').addEventListener('change',e=>{
  if(e.target.files[0]){
    audioB=new Audio(URL.createObjectURL(e.target.files[0]));
    audioB.loop=true;
    setupAudio('B',audioB);
    document.getElementById('status').textContent='کانال B آماده';
  }
});

function setupAudio(ch,audio){
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const analyser=ctx.createAnalyser();
  analyser.fftSize=256;
  const gain=ctx.createGain();
  gain.gain.value=1.5; // تقویت صدا
  const source=ctx.createMediaElementSource(audio);
  source.connect(analyser);
  analyser.connect(gain);
  gain.connect(ctx.destination);
  if(ch==='A'){ctxA={ctx,analyser,gain,data:new Uint8Array(analyser.frequencyBinCount)}}
  else{ctxB={ctx,analyser,gain,data:new Uint8Array(analyser.frequencyBinCount)}}
}

function toggleA(){
  if(!audioA){alert('اول آهنگ A را انتخاب کن');return}
  if(isPlayingA){audioA.pause();isPlayingA=false;document.getElementById('vinylA').classList.remove('spinning');document.getElementById('btnA').textContent='▶️ پخش A';ctxA.ctx.suspend();}
  else{audioA.play();isPlayingA=true;document.getElementById('vinylA').classList.add('spinning');document.getElementById('btnA').textContent='⏸️ توقف A';ctxA.ctx.resume();}
}

function toggleB(){
  if(!audioB){alert('اول آهنگ B را انتخاب کن');return}
  if(isPlayingB){audioB.pause();isPlayingB=false;document.getElementById('vinylB').classList.remove('spinning');document.getElementById('btnB').textContent='▶️ پخش B';ctxB.ctx.suspend();}
  else{audioB.play();isPlayingB=true;document.getElementById('vinylB').classList.add('spinning');document.getElementById('btnB').textContent='⏸️ توقف B';ctxB.ctx.resume();}
}

document.getElementById('volA').addEventListener('input',e=>{if(ctxA)ctxA.gain.gain.value=e.target.value*2});
document.getElementById('volB').addEventListener('input',e=>{if(ctxB)ctxB.gain.gain.value=e.target.value*2});

document.getElementById('crossfade').addEventListener('input',e=>{
  const val=parseFloat(e.target.value);
  if(ctxA)ctxA.gain.gain.value=Math.max(0,1-val)*document.getElementById('volA').value*2;
  if(ctxB)ctxB.gain.gain.value=val*document.getElementById('volB').value*2;
});

// ویجوالایزر الماسی
const canvas=document.getElementById('visualizer');
const cctx=canvas.getContext('2d');
function resizeCanvas(){canvas.width=canvas.parentElement.clientWidth*2;canvas.height=200*2;canvas.style.height='200px'}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

function drawVisualizer(bassA,bassB){
  cctx.clearRect(0,0,canvas.width,canvas.height);
  const intensity=Math.max(bassA,bassB);
  
  // پس‌زمینه تیره
  cctx.fillStyle='rgba(10,10,18,0.5)';
  cctx.fillRect(0,0,canvas.width,canvas.height);
  
  // الماس‌های متحرک
  diamonds.forEach(d=>{
    d.x+=d.vx*(intensity/50+0.2);
    d.y+=d.vy*(intensity/50+0.2);
    d.rot+=0.02;
    if(d.x>canvas.width)d.x=0;
    if(d.y>canvas.height)d.y=0;
    cctx.save();
    cctx.translate(d.x,d.y);
    cctx.rotate(d.rot);
    cctx.shadowColor='#f59e0b';
    cctx.shadowBlur=d.r*intensity/30;
    cctx.fillStyle='hsla('+(intensity*3)%360+',100%,60%,'+d.alpha+')';
    cctx.beginPath();
    for(let i=0;i<4;i++){
      cctx.lineTo(Math.cos(i*Math.PI/2)*d.r,Math.sin(i*Math.PI/2)*d.r);
    }
    cctx.closePath();
    cctx.fill();
    cctx.restore();
  });
}

function detectBeat(){
  let bassA=0,bassB=0;
  if(ctxA&&isPlayingA){ctxA.analyser.getByteFrequencyData(ctxA.data);for(let i=0;i<20;i++)bassA+=ctxA.data[i];bassA/=20;}
  if(ctxB&&isPlayingB){ctxB.analyser.getByteFrequencyData(ctxB.data);for(let i=0;i<20;i++)bassB+=ctxB.data[i];bassB/=20;}
  
  const threshold=70;
  if(bassA>threshold||bassB>threshold){
    document.body.style.background='#1a0a2a';
    for(let i=0;i<6;i++){
      document.getElementById('dm'+i).classList.add('on');
      if(bassA>threshold)document.getElementById('da'+i).classList.add('on');
      if(bassB>threshold)document.getElementById('db'+i).classList.add('on');
    }
  }else{
    document.body.style.background='#0a0a12';
    for(let i=0;i<6;i++){
      document.getElementById('dm'+i).classList.remove('on');
      document.getElementById('da'+i).classList.remove('on');
      document.getElementById('db'+i).classList.remove('on');
    }
  }
  
  drawVisualizer(bassA,bassB);
  if(isPlayingA||isPlayingB)requestAnimationFrame(detectBeat);
}

window.addEventListener('beforeunload',()=>{
  if(audioA)audioA.pause();
  if(audioB)audioB.pause();
});
</script></body></html>
