<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دی‌جی حرفه‌ای</title>
<link rel="stylesheet" href="style.css"></head><body>
<div class="container">
  <h1>🎧 دی‌جی حرفه‌ای</h1>
  
  <div class="deck">
    <div class="deck-side">
      <h3>کانال A</h3>
      <div class="turntable"><div class="vinyl" id="vinylA"></div></div>
      <button class="btn" id="btnA" onclick="toggle('A')">▶️ پخش A</button>
      <input type="range" class="slider" id="volA" min="0" max="1" step="0.01" value="0.8">
      <div class="time-control">
        <button class="btn small" onclick="seek('A', -10)">⏪ ۱۰ ثانیه</button>
        <input type="range" class="slider" id="seekA" min="0" max="100" step="0.1" value="0">
        <button class="btn small" onclick="seek('A', 10)">⏩ ۱۰ ثانیه</button>
        <div class="time-display" id="timeA">00:00 / 00:00</div>
      </div>
    </div>
    
    <div class="deck-side">
      <h3>کانال B</h3>
      <div class="turntable"><div class="vinyl" id="vinylB"></div></div>
      <button class="btn" id="btnB" onclick="toggle('B')">▶️ پخش B</button>
      <input type="range" class="slider" id="volB" min="0" max="1" step="0.01" value="0.8">
      <div class="time-control">
        <button class="btn small" onclick="seek('B', -10)">⏪ ۱۰ ثانیه</button>
        <input type="range" class="slider" id="seekB" min="0" max="100" step="0.1" value="0">
        <button class="btn small" onclick="seek('B', 10)">⏩ ۱۰ ثانیه</button>
        <div class="time-display" id="timeB">00:00 / 00:00</div>
      </div>
    </div>
  </div>

  <div class="crossfader">
    <label>🎚 کراس‌فیدر</label>
    <input type="range" class="slider" id="crossfade" min="0" max="1" step="0.01" value="0.5">
  </div>
  
  <div class="visualizer-wrap">
    <canvas id="visualizer"></canvas>
  </div>
  
  <div class="beat-dots" id="masterDots"></div>
  
  <div class="controls">
    <button class="btn small" onclick="document.getElementById('fileA').click()">🎵 آهنگ A</button>
    <button class="btn small" onclick="document.getElementById('fileB').click()">🎵 آهنگ B</button>
  </div>
  
  <input type="file" id="fileA" accept="audio/*" style="display:none">
  <input type="file" id="fileB" accept="audio/*" style="display:none">
  
  <div class="status" id="status">آهنگ انتخاب کنید</div>
</div>

<script src="script.js"></script>
</body></html>
